<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Desconto</title>
    <script src="../js/script_calc.js" defer></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #410464;
            color: #7c0458;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: #7c32d1;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(81, 6, 151, 0.08);
            width: 100%;
            max-width: 400px;
        }

        h1 {
            font-size: 1.5rem;
            color: #ffffff;
            margin-bottom: 20px;
            text-align: center;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            font-size: 0.9rem;
            color: #310231;
        }

        .input-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        .input-group input:focus {
            outline: none;
            border-color: #a634db;
            box-shadow: 0 0 5px rgba(247, 14, 208, 0.3);
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn-primary {
            background-color: #850e7b;
            color: white;
        }

        .btn-primary:hover {
            background-color: #a829b9;
        }

        .btn-secondary {
            background-color: #e0e0e0;
            color: #333;
        }

        .btn-secondary:hover {
            background-color: #d0d0d0;
        }

        .resultado-box {
            margin-top: 25px;
            padding: 15px;
            background-color: #f9f9f9;
            border-left: 4px solid #db34db;
            border-radius: 4px;
        }

        .resultado-box h3 {
            font-size: 1.1rem;
            color: #630243;
            margin-bottom: 10px;
        }

        .resultado-box p {
            font-size: 0.95rem;
            margin-bottom: 5px;
            color: #b60990;
        }
    </style>
</head>
<body>
    <main class="container">
        <h1>Calculadora de Desconto</h1>
        
        <form onsubmit="event.preventDefault(); Calcular();">
            <div class="input-group">
                <label for="produto">Produto:</label>
                <input type="text" id="produto" placeholder="Nome do produto">
            </div>

            <div class="input-group">
                <label for="valor">Valor (R$):</label>
                <input type="number" step="0.01" id="valor" placeholder="0.00">
            </div>

            <div class="input-group">
                <label for="desconto">Desconto (%):</label>
                <input type="number" step="5" id="desconto" placeholder="0">
            </div>

            <div class="button-group">
                <input type="submit" value="Calcular" class="btn btn-primary">
                <input type="reset" value="Limpar" class="btn btn-secondary">
            </div>
        </form>

        <div class="resultado-box">
            <h3>Resultado</h3>
            <p id="resultado1">Produto: </p>
            <p id="resultado2">Valor: </p>
            <p id="resultado3">Desconto: </p>
            <p id="resultado4">Valor Final: </p>
        </div>
    </main>
</body>
</html>
